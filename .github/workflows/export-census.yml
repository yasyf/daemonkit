name: Export census

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: export-census-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The census parses every GOOS lane itself, so one runner covers the
      # darwin-only exports too.
      - name: Check the exported surface against ci/exported.txt
        run: ./scripts/export-census.sh
