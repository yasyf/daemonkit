name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs only: cancel-in-progress on main repeatedly killed the slow swift job
# mid-run, leaving commits with no CI verdict (ccn af9889a).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Timeouts kill a wedged test in minutes instead of GitHub's 6-hour cap
# (ccn af9889a).
jobs:
  source-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Verify source-only release contract
        run: ./scripts/release-check.sh --tree

  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Frame codec drift gate
        run: ./scripts/check-codegen.sh

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The macOS half. linux has its own job below: it vets no darwin-only
        # surface and its harness cap is sized differently.
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        # -unsafeptr=false: dlsym data-symbol FFI in trust/ (ccn 239201e).
        run: go vet -unsafeptr=false ./...

      - name: Vet (out-of-suite e2e)
        # No surface here is reached by ./... — _e2e and _e2e/trust are underscore-skipped
        # and the deploy half is tag-gated — so without this they rot until someone runs
        # the script. _e2e/trust needs a Developer ID identity no runner has, so vetting it
        # is the only CI signal it gets.
        run: |
          go vet -unsafeptr=false ./_e2e
          go vet -unsafeptr=false ./_e2e/trust
          go vet -unsafeptr=false -tags dke2e ./deploy
      - name: Test (race, via the process-cap harness)
        run: ./scripts/test.sh -race ./...
      - name: Build (pure)
        run: CGO_ENABLED=0 go build ./...

  # The linux half, run natively: the /proc, pidfd, ptrace-suspended spawn,
  # SO_PEERCRED, and supervisor paths execute nowhere else.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # RLIMIT_NPROC counts every thread of the uid on linux, and the harness
      # sizes its cap from a process count, so the default headroom is reached
      # by the race-instrumented suite's own threads.
      TEST_NPROC_HEADROOM: "4000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test (race, via the process-cap harness)
        run: ./scripts/test.sh -race ./...
      - name: Build (pure)
        run: CGO_ENABLED=0 go build ./...

  # The declared boundary of what builds on linux, gated in both directions.
  # Cross-compiles, so it costs a linux runner nothing to enumerate darwin too.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Portable subset gate
        run: ./scripts/portable-gate.sh

  # Static analysis type-checks the tree, so it runs once per platform.
  # GOOS/GOARCH keep both on a cheap linux runner instead of billing macOS
  # minutes 10x.
  lint:
    name: lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    name: vuln (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          GOOS= GOARCH= go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # One Swift job (macOS minutes bill 10x); macos-26 pinned — its image ships
  # the Xcode 26.x / Swift 6.2 toolchain Package.swift needs.
  swift:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install lint tools missing from the image
        # macos-26 ships swiftformat but not swiftlint; guard both against image churn.
        run: |
          command -v swiftformat >/dev/null || brew install swiftformat
          command -v swiftlint >/dev/null || brew install swiftlint
      - name: Format (lint mode)
        run: swiftformat --lint .
      - name: Lint
        run: swiftlint --quiet
      - name: Build
        run: swift build
      - name: Test
        # scripts/swift-test.sh builds the Go wire test server the client suites
        # dial and exports its path as DAEMONKIT_WIRE_TEST_SERVER.
        run: ./scripts/swift-test.sh
      - name: Strict cooperative executor transport
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: ./scripts/swift-test.sh --filter ServiceSocketClientTests
