name: Fleet build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: fleet-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Compiles every consumer against this tree via a generated go.work overlay, so
# a breaking surface change goes red before a release exists. One leg per
# consumer: a break names its own consumer in the checks list.
jobs:
  fleet-build:
    name: fleet-build (${{ matrix.repo }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repo:
          - synckit
          - fusekit
          - reposync
          - captain-hook
          - cc-notes
          - cc-patch
          - cc-orchestrate
          - cc-interact
          - binrun
          - cc-present
          - cc-review
          - cc-pool
          - cookiesync
    # daemonkit is macOS-only, so its consumers cross-compile here rather than
    # billing macOS minutes across every leg of the fleet. Which platforms a leg
    # cross-compiles for is the consumer's own declaration in ci/fleet-refs.txt,
    # which the script reads; GOARCH is the fleet's shipped arch throughout.
    env:
      CGO_ENABLED: "0"
      GOARCH: arm64
    steps:
      - name: Check out daemonkit
        uses: actions/checkout@v7
        with:
          path: daemonkit

      # Both halves of the gate read ci/fleet-refs.txt through the script, so a
      # leg pointed at a migration branch checks out the tree it then builds.
      - name: Resolve the ref ${{ matrix.repo }} builds
        id: ref
        working-directory: daemonkit
        run: |
          set -euo pipefail
          ref="$(./scripts/fleet-build.sh --ref ${{ matrix.repo }})"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      # FLEET_TOKEN reaches private consumers; GITHUB_TOKEN covers the public
      # ones. A denied checkout fails the leg: a release gates on this build,
      # so a consumer that never compiled must not report green.
      - name: Check out ${{ matrix.repo }}
        id: consumer
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: yasyf/${{ matrix.repo }}
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.FLEET_TOKEN || secrets.GITHUB_TOKEN }}
          path: ${{ matrix.repo }}
          persist-credentials: false

      - name: Report an unreachable consumer
        if: steps.consumer.outcome != 'success'
        run: |
          echo "::warning title=fleet-build failed ${{ matrix.repo }}::checkout of yasyf/${{ matrix.repo }} was denied — this consumer was NOT built against daemonkit. Grant a FLEET_TOKEN with read access to it."
          echo "### :warning: fleet-build failed \`${{ matrix.repo }}\`" >>"$GITHUB_STEP_SUMMARY"
          echo "Checkout was denied, so this consumer was not compiled against daemonkit." >>"$GITHUB_STEP_SUMMARY"
          exit 1

      # A consumer that also sits on a migrating peer — cc-interact, cc-notes,
      # fusekit, synckit — otherwise resolves it from its published tag, so the
      # leg measures a peer nobody can fix here and reports its break as
      # daemonkit's. The cone is intersected with the fleet set, so every peer
      # named here has a ci/fleet-refs.txt ref of its own; it joins the same
      # go.work at that ref, and one the token cannot reach falls back to its
      # tag, loudly.
      - name: Check out the fleet substrate ${{ matrix.repo }} sits on
        working-directory: daemonkit
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          peers="$(./scripts/fleet-build.sh --cone "${{ matrix.repo }}")"
          for peer in $peers; do
            ref="$(./scripts/fleet-build.sh --ref "$peer")"
            if git clone --quiet --depth 1 --branch "$ref" \
              "https://x-access-token:${FLEET_TOKEN}@github.com/yasyf/$peer" \
              "${GITHUB_WORKSPACE}/$peer"; then
              git -C "${GITHUB_WORKSPACE}/$peer" remote set-url origin "https://github.com/yasyf/$peer"
              echo "cone: $peer at $ref"
            else
              echo "::warning title=fleet-build could not reach $peer::${{ matrix.repo }} builds against the published $peer rather than its tree, so a break in that peer reads as daemonkit's."
            fi
          done

      - uses: actions/setup-go@v6
        with:
          go-version-file: daemonkit/go.mod
          cache-dependency-path: |
            daemonkit/go.sum
            ${{ matrix.repo }}/go.sum

      - name: Build ${{ matrix.repo }} against the daemonkit tree
        working-directory: daemonkit
        run: ./scripts/fleet-build.sh --only ${{ matrix.repo }}
