name: Mixed era

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: mixed-era-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mixed-era:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macOS only: the module no longer compiles off darwin.
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Mixed-era gate
        run: ./scripts/mixed-era.sh
