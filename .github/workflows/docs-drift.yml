name: Docs drift

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package-table:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check the package table against the tree
        run: ./scripts/gen-package-table.sh --check
