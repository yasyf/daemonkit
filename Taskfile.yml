version: '3'

tasks:
  build:
    desc: Build every Go package pure (proves the module stays cgo-free)
    cmds:
      - CGO_ENABLED=0 go build ./...

  test:
    desc: Run the Go suite with the race detector, via the process-cap harness
    cmds:
      - ./scripts/test.sh -race -count=1 ./...

  test-swift:
    desc: Run the Swift package tests against the Go wire test server they dial
    cmds:
      - ./scripts/swift-test.sh

  generate:
    desc: Regenerate the frame codec (Go internal/wire + Swift SessionFrameCodec) from internal/wiregen/schema.json
    cmds:
      - go generate ./internal/wire

  generate-check:
    desc: Fail when the generated frame codec drifts from its schema
    cmds:
      - ./scripts/check-codegen.sh

  vet:
    desc: Vet the module
    # -unsafeptr=false: dlsym data-symbol FFI in trust/ (ccn 239201e); lockstep
    # with .golangci.yml and ci.yml.
    cmds:
      - go vet -unsafeptr=false ./...

  lint:
    desc: Lint with golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format with gofumpt + goimports (via golangci-lint)
    cmds:
      - golangci-lint fmt

  ci:
    desc: Everything CI runs
    cmds:
      - task: generate-check
      - task: vet
      - task: lint
      - task: test
      - task: build
      - task: test-swift
